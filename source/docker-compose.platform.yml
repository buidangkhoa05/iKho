# Local platform infrastructure for warehouse services: single-node Kafka (KRaft mode, no
# Zookeeper) and PostgreSQL. Intended for local development and manual verification of the
# Ikho.SharedLibrary health checks, outbox publisher, and idempotency store.
#
# Usage:
#   docker compose -f docker-compose.platform.yml up -d
#   docker compose -f docker-compose.platform.yml down -v   # to reset volumes

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: ikho-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - ikho-kafka-data:/var/lib/kafka/data

  postgres:
    image: postgres:16
    container_name: ikho-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ikho
      POSTGRES_PASSWORD: ikho
      POSTGRES_DB: ikho_warehouse
    volumes:
      - ikho-postgres-data:/var/lib/postgresql/data

volumes:
  ikho-kafka-data:
  ikho-postgres-data:
