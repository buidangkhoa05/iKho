# Runs the whole iKho stack: postgres, kafka, every .NET service, and the Angular UI.
#
# Usage:
#   docker compose up --build          # build images and start everything
#   docker compose up --build -d       # same, detached
#   docker compose down -v             # stop and reset volumes
#
# Entry points once everything is healthy:
#   UI                http://localhost:4200
#   API gateway        http://localhost:5080  (docs at /docs)
#
# For infra-only local dev (running services with `pnpm nx serve`), use
# docker-compose.platform.yml instead - this file replaces it when you want
# the entire project running in containers.

services:
  postgres:
    image: postgres:16
    container_name: ikho-postgres
    environment:
      POSTGRES_USER: ikho
      POSTGRES_PASSWORD: ikho
      POSTGRES_DB: ikho_warehouse
    ports:
      - "5432:5432"
    volumes:
      - ikho-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ikho -d ikho_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: ikho-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT is reachable from the host at localhost:9092; INTERNAL is what
      # containers on the compose network use to reach each other as `kafka:29092`.
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - ikho-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9092' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  shared-library:
    build:
      context: .
      dockerfile: docker/dotnet.Dockerfile
      args:
        PROJECT_PATH: libs/ikho-shared-library/Ikho.SharedLibrary.csproj
        ASSEMBLY_NAME: Ikho.SharedLibrary
    container_name: ikho-shared-library
    ports:
      - "5143:8080"

  warehouse-organization:
    build:
      context: .
      dockerfile: docker/dotnet.Dockerfile
      args:
        PROJECT_PATH: apps/ikho-warehouse-organization/Ikho.Warehouse.Organization.csproj
        ASSEMBLY_NAME: Ikho.Warehouse.Organization
    container_name: ikho-warehouse-organization
    environment:
      Database__ConnectionString: Host=postgres;Port=5432;Database=ikho_warehouse_organization;Username=ikho;Password=ikho
      MessageBroker__BootstrapServers: kafka:29092
    ports:
      - "5151:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  warehouse-catalog:
    build:
      context: .
      dockerfile: docker/dotnet.Dockerfile
      args:
        PROJECT_PATH: apps/ikho-warehouse-catalog/Ikho.Warehouse.Catalog.csproj
        ASSEMBLY_NAME: Ikho.Warehouse.Catalog
    container_name: ikho-warehouse-catalog
    environment:
      Database__ConnectionString: Host=postgres;Port=5432;Database=ikho_warehouse_catalog;Username=ikho;Password=ikho
      MessageBroker__BootstrapServers: kafka:29092
    ports:
      - "5152:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  warehouse-partner:
    build:
      context: .
      dockerfile: docker/dotnet.Dockerfile
      args:
        PROJECT_PATH: apps/ikho-warehouse-partner/Ikho.Warehouse.Partner.csproj
        ASSEMBLY_NAME: Ikho.Warehouse.Partner
    container_name: ikho-warehouse-partner
    environment:
      Database__ConnectionString: Host=postgres;Port=5432;Database=ikho_warehouse_partner;Username=ikho;Password=ikho
      MessageBroker__BootstrapServers: kafka:29092
    ports:
      - "5153:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  warehouse-inventory:
    build:
      context: .
      dockerfile: docker/dotnet.Dockerfile
      args:
        PROJECT_PATH: apps/ikho-warehouse-inventory/Ikho.Warehouse.Inventory.csproj
        ASSEMBLY_NAME: Ikho.Warehouse.Inventory
    container_name: ikho-warehouse-inventory
    environment:
      Database__ConnectionString: Host=postgres;Port=5432;Database=ikho_warehouse_inventory;Username=ikho;Password=ikho
      MessageBroker__BootstrapServers: kafka:29092
      Services__Catalog: http://warehouse-catalog:8080
      Services__Organization: http://warehouse-organization:8080
    ports:
      - "5154:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      warehouse-catalog:
        condition: service_healthy
      warehouse-organization:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  warehouse-inbound:
    build:
      context: .
      dockerfile: docker/dotnet.Dockerfile
      args:
        PROJECT_PATH: apps/ikho-warehouse-inbound/Ikho.Warehouse.Inbound.csproj
        ASSEMBLY_NAME: Ikho.Warehouse.Inbound
    container_name: ikho-warehouse-inbound
    environment:
      Database__ConnectionString: Host=postgres;Port=5432;Database=ikho_warehouse_inbound;Username=ikho;Password=ikho
      MessageBroker__BootstrapServers: kafka:29092
      Services__Catalog: http://warehouse-catalog:8080
      Services__Partner: http://warehouse-partner:8080
      Services__Organization: http://warehouse-organization:8080
      Services__Inventory: http://warehouse-inventory:8080
    ports:
      - "5155:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      warehouse-catalog:
        condition: service_healthy
      warehouse-partner:
        condition: service_healthy
      warehouse-organization:
        condition: service_healthy
      warehouse-inventory:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  warehouse-outbound:
    build:
      context: .
      dockerfile: docker/dotnet.Dockerfile
      args:
        PROJECT_PATH: apps/ikho-warehouse-outbound/Ikho.Warehouse.Outbound.csproj
        ASSEMBLY_NAME: Ikho.Warehouse.Outbound
    container_name: ikho-warehouse-outbound
    environment:
      Database__ConnectionString: Host=postgres;Port=5432;Database=ikho_warehouse_outbound;Username=ikho;Password=ikho
      MessageBroker__BootstrapServers: kafka:29092
      Services__Catalog: http://warehouse-catalog:8080
      Services__Partner: http://warehouse-partner:8080
      Services__Organization: http://warehouse-organization:8080
      Services__Inventory: http://warehouse-inventory:8080
    ports:
      - "5156:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      warehouse-catalog:
        condition: service_healthy
      warehouse-partner:
        condition: service_healthy
      warehouse-organization:
        condition: service_healthy
      warehouse-inventory:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  warehouse-returns:
    build:
      context: .
      dockerfile: docker/dotnet.Dockerfile
      args:
        PROJECT_PATH: apps/ikho-warehouse-returns/Ikho.Warehouse.Returns.csproj
        ASSEMBLY_NAME: Ikho.Warehouse.Returns
    container_name: ikho-warehouse-returns
    environment:
      Database__ConnectionString: Host=postgres;Port=5432;Database=ikho_warehouse_returns;Username=ikho;Password=ikho
      MessageBroker__BootstrapServers: kafka:29092
      Services__Catalog: http://warehouse-catalog:8080
      Services__Organization: http://warehouse-organization:8080
      Services__Partner: http://warehouse-partner:8080
      Services__Inventory: http://warehouse-inventory:8080
    ports:
      - "5157:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      warehouse-catalog:
        condition: service_healthy
      warehouse-organization:
        condition: service_healthy
      warehouse-partner:
        condition: service_healthy
      warehouse-inventory:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  warehouse-billing:
    build:
      context: .
      dockerfile: docker/dotnet.Dockerfile
      args:
        PROJECT_PATH: apps/ikho-warehouse-billing/Ikho.Warehouse.Billing.csproj
        ASSEMBLY_NAME: Ikho.Warehouse.Billing
    container_name: ikho-warehouse-billing
    environment:
      Database__ConnectionString: Host=postgres;Port=5432;Database=ikho_warehouse_billing;Username=ikho;Password=ikho
      MessageBroker__BootstrapServers: kafka:29092
      Services__Catalog: http://warehouse-catalog:8080
      Services__Partner: http://warehouse-partner:8080
    ports:
      - "5158:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      warehouse-catalog:
        condition: service_healthy
      warehouse-partner:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  warehouse-reporting:
    build:
      context: .
      dockerfile: docker/dotnet.Dockerfile
      args:
        PROJECT_PATH: apps/ikho-warehouse-reporting/Ikho.Warehouse.Reporting.csproj
        ASSEMBLY_NAME: Ikho.Warehouse.Reporting
    container_name: ikho-warehouse-reporting
    environment:
      Database__ConnectionString: Host=postgres;Port=5432;Database=ikho_warehouse_reporting;Username=ikho;Password=ikho
      MessageBroker__BootstrapServers: kafka:29092
    ports:
      - "5159:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api-gateway:
    build:
      context: .
      dockerfile: docker/dotnet.Dockerfile
      args:
        PROJECT_PATH: apps/ikho-api-gateway/Ikho.ApiGateway.csproj
        ASSEMBLY_NAME: Ikho.ApiGateway
    container_name: ikho-api-gateway
    environment:
      ReverseProxy__Clusters__shared-library-cluster__Destinations__destination1__Address: http://shared-library:8080
      ReverseProxy__Clusters__warehouse-organization-cluster__Destinations__destination1__Address: http://warehouse-organization:8080
      ReverseProxy__Clusters__warehouse-catalog-cluster__Destinations__destination1__Address: http://warehouse-catalog:8080
      ReverseProxy__Clusters__warehouse-partner-cluster__Destinations__destination1__Address: http://warehouse-partner:8080
      ReverseProxy__Clusters__warehouse-inventory-cluster__Destinations__destination1__Address: http://warehouse-inventory:8080
      ReverseProxy__Clusters__warehouse-inbound-cluster__Destinations__destination1__Address: http://warehouse-inbound:8080
      ReverseProxy__Clusters__warehouse-outbound-cluster__Destinations__destination1__Address: http://warehouse-outbound:8080
      ReverseProxy__Clusters__warehouse-returns-cluster__Destinations__destination1__Address: http://warehouse-returns:8080
      ReverseProxy__Clusters__warehouse-billing-cluster__Destinations__destination1__Address: http://warehouse-billing:8080
      ReverseProxy__Clusters__warehouse-reporting-cluster__Destinations__destination1__Address: http://warehouse-reporting:8080
    ports:
      - "5080:8080"
    depends_on:
      shared-library:
        condition: service_started
      warehouse-organization:
        condition: service_healthy
      warehouse-catalog:
        condition: service_healthy
      warehouse-partner:
        condition: service_healthy
      warehouse-inventory:
        condition: service_healthy
      warehouse-inbound:
        condition: service_healthy
      warehouse-outbound:
        condition: service_healthy
      warehouse-returns:
        condition: service_healthy
      warehouse-billing:
        condition: service_healthy
      warehouse-reporting:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: apps/ikho-ui/Dockerfile
    container_name: ikho-ui
    environment:
      PORT: 4000
      # @angular/ssr rejects requests whose Host header isn't in this list
      # (SSRF hardening) - localhost:4200 is how the UI is reached from the host.
      NG_ALLOWED_HOSTS: localhost,127.0.0.1
    ports:
      - "4200:4000"
    depends_on:
      api-gateway:
        condition: service_started

volumes:
  ikho-postgres-data:
  ikho-kafka-data:
